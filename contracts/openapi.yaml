openapi: 3.1.0
info:
  title: Family Expense API
  version: 1.0.0
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } }
  /me:
    get:
      operationId: getMe
      summary: Usuario autenticado
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      schema: { type: string, format: uuid }
  schemas:
    Me:
      type: object
      required: [id, locale]
      properties:
        id: { type: string, format: uuid }
        locale: { type: string, example: es-MX }
    ClientId:
      type: string
      format: uuid
      description: "Generado por el cliente en cada escritura; es la clave de idempotencia. Un reintento devuelve el resultado original."
    BaseRevision:
      type: integer
      minimum: 1
      description: "Revisión sobre la que se basa una edición. Si está desactualizada la respuesta es 409 con current_revision."
    Money:
      type: object
      required: [centavos, currency]
      properties:
        centavos: { type: integer, description: "Entero en centavos; nunca decimales" }
        currency: { type: string, minLength: 3, maxLength: 3, example: MXN }
    Error:
      type: object
      required: [code, message, correlation_id]
      properties:
        code: { type: string, example: stale_revision }
        message: { type: string }
        correlation_id: { type: string }
        current_revision: { type: integer, description: "Presente en 409 por revisión desactualizada" }
  responses:
    Error:
      description: Error con formato único
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StaleRevision:
      description: La revisión base está desactualizada; el cuerpo trae current_revision
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
