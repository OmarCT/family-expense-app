name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { service: [core, workers] } }
    defaults: { run: { working-directory: "services/${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pipx install poetry
      - run: poetry install
      - run: poetry check --lock
      - run: poetry run ruff check .
      - run: poetry run mypy .
      - run: poetry run pytest
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
  vectors:
    name: shared money vectors (Python + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pipx install poetry
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cd services/core && poetry install && poetry run pytest -m vectors
      - run: pnpm --filter @fea/domain test:vectors
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli lint contracts/openapi.yaml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fea/sync-client generate:api
      - name: El cliente generado coincide con el contrato
        run: git diff --exit-code packages/sync-client/src/generated
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: core }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORE_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/core
    defaults: { run: { working-directory: services/core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run alembic upgrade head
      - run: poetry run alembic downgrade base
      - run: poetry run alembic upgrade head
  terraform:
    runs-on: ubuntu-latest
    strategy: { matrix: { env: [staging, prod] } }
    defaults: { run: { working-directory: "infra/envs/${{ matrix.env }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
